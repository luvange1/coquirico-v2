   underneath copy or a scrim: every chapter is staged copy-above / can-below, and the can only crosses
   a chapter's copy while a pour covers that copy.
   ================================================================================================ */
#can{position:fixed;left:0;top:0;z-index:7;pointer-events:none;will-change:transform;transform-origin:50% 96%;
  transform:translate3d(-999px,0,0)}
#can img{position:absolute;inset:0;width:100%;height:100%}
#can .halo{position:absolute;left:-22%;right:-22%;top:18%;bottom:6%;border-radius:50%;
  background:radial-gradient(closest-side, color-mix(in srgb,var(--acc) 30%,transparent), transparent)}
#can .pool{position:absolute;left:0;right:0;height:13%;top:89.5%;border-radius:50%;
  background:radial-gradient(closest-side, color-mix(in srgb,var(--acc) 55%,transparent), transparent)}
#can .shadow{position:absolute;left:27%;right:27%;height:4.4%;top:93.8%;border-radius:50%;
  background:radial-gradient(closest-side, rgba(0,0,0,.62), rgba(0,0,0,.28) 55%, transparent)}
/* the sheen: a soft highlight masked to the can's own silhouette, slid across by the scroll — the flat photo reads as turning */
#can .sheen{position:absolute;inset:0;overflow:hidden;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#can .sheen i{position:absolute;top:0;bottom:0;left:0;width:60%;will-change:transform;
  background:linear-gradient(100deg, rgba(255,250,235,0) 0%, rgba(255,250,235,.20) 42%, rgba(255,250,235,.30) 50%, rgba(255,250,235,.20) 58%, rgba(255,250,235,0) 100%)}
/* arrival: the can lifts a breath as the pour colour drains off it */
#can img,#can .sheen{transition:transform 1.25s cubic-bezier(.2,.7,.2,1)}
html.pre #can img,html.pre #can .sheen{transform:translate3d(0,3.5%,0)}
html.light-world #can .halo{opacity:.55}
html.light-world #can .pool{opacity:.5}

/* ================================================================================================
   MUNDO · THE POUR — a band of the drink's colour that rises from the bottom, holds the screen with the
   chapter word, and passes on up, leaving the next world behind it. transform-only; the crest's sideways
   flow is a CSS animation that runs only while a band is on screen.
   ================================================================================================ */
.band{position:fixed;left:0;top:0;width:100%;z-index:5;pointer-events:none;visibility:hidden;will-change:transform}
.band.on{visibility:visible}
.band .crest{position:relative;height:64px;overflow:hidden;transform-origin:50% 100%}
.band .crest.bot{transform-origin:50% 0}
.band .crest svg{position:absolute;left:0;top:0;width:200%;height:100%;display:block}
.band.on .crest svg{animation:flow 6.5s linear infinite}
.band .crest.bot svg{animation-direction:reverse}
@keyframes flow{to{transform:translate3d(-50%,0,0)}}
.band .body{margin:-1px 0}
.band path{fill:currentColor}
#band0{color:var(--band0)} #band0 .body{background:var(--band0)}
#band2{color:var(--band2)} #band2 .body{background:var(--band2)}
#band3{color:var(--band3)} #band3 .body{background:var(--band3)}
.word{position:fixed;left:0;right:0;top:0;z-index:6;pointer-events:none;text-align:center;visibility:hidden;will-change:transform,opacity;
  font-family:var(--serif);font-style:italic;font-weight:500;font-size:52px;line-height:1;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.word.on{visibility:visible}
#word0{color:var(--wink0)} #word2{color:var(--wink2)} #word3{color:var(--wink3)}

/* picking a drink: V2's waveSwap, full screen — pour up in the new colour, swap at the crest, drain */
#swap{position:fixed;left:0;top:0;width:100%;z-index:8;pointer-events:none;visibility:hidden;will-change:transform}
#swap.on{visibility:visible}
#swap .crest{position:relative;height:64px;overflow:hidden}
#swap .crest svg{position:absolute;left:0;top:0;width:200%;height:100%}
#swap.on .crest svg{animation:flow 3.2s linear infinite}
#swap .body{margin-top:-1px;height:var(--L)}

/* ================================================================================================
   MUNDO · ARRIVAL — V2's pour colour + the same spinning coquí (V2 .follow-frog, px-identical), then the
   colour drains down off the can. id="hand-veil" so the V1 profiler's arrival wait works unchanged.
   ================================================================================================ */
#hand-veil{position:fixed;left:0;top:0;width:100%;height:var(--L);z-index:20;background:var(--veil,var(--acc));will-change:transform}
#hand-veil .crest{position:absolute;left:0;right:0;top:-63px;height:64px;overflow:hidden;color:var(--veil,var(--acc))}
#hand-veil .crest svg{position:absolute;left:0;top:0;width:200%;height:100%}
#hand-veil.drain .crest svg{animation:flow 2.6s linear infinite}
#hand-veil path{fill:currentColor}
#hand-frog{position:fixed;left:50%;top:50%;width:66px;margin:-33px 0 0 -33px;z-index:21;pointer-events:none;
  animation:followspin 1.05s cubic-bezier(.5,0,.5,1) infinite;transition:opacity .28s ease}
#hand-frog.out{opacity:0}
@keyframes followspin{0%{transform:rotateY(0deg) scale(1)}50%{transform:rotateY(180deg) scale(1.08)}100%{transform:rotateY(360deg) scale(1)}}

/* ================================================================================================

   world's colour (no backdrop blur) that copy scrolls up into.
   ================================================================================================ */

  background:linear-gradient(180deg, var(--navbg,rgba(8,9,6,.92)) 0%, var(--navbg,rgba(8,9,6,.92)) 62%, transparent 100%)}

html[data-w="island"],html[data-w="merch"]{--navbg:rgba(6,8,5,.78)}

      if (y + 0.85 * C < 26 && y + C + B + 0.15 * C > 34) navBand = h.wi;     /* the colour fully behind the wordmark */
      h.word.style.opacity = op.toFixed(3);
      h.word.style.transform = 'translate3d(0,' + wy.toFixed(1) + 'px,0) scale(' + (0.94 + 0.1 * w).toFixed(3) + ',1)';
    });

    setNavBand(swapping && swapY < -30 ? 'swap' : navBand);

    /* ---- copy: each chapter's words arrive as they land home (a pour or the crossfade has them covered until then) ---- */
    K.ch.forEach(function(c, k){
      var o = (k === 0 ? 1 : smooth(c.home - 96, c.home - 4, s)) * smooth(NAV + 4, NAV + 120, c.bottom - s);
      var b = blkState[k] || (blkState[k] = { el:document.getElementById(['hero','world','story','drink','merch'][k]).querySelector('.blk'), o:-1 });
      if (Math.abs(b.o - o) > 0.002){ b.o = o; b.el.style.opacity = o.toFixed(3); b.el.style.transform = o >= 1 ? 'none' : 'translate3d(0,' + ((1 - o) * 22).toFixed(1) + 'px,0)'; }
    });

    /* ---- the can: follow the target with a short, dt-based ease (it trails, never teleports) ---- */
    var sl = tg.slot;
    if (!cur || quiet) cur = { cx:sl.cx, floor:sl.floor, h:sl.h, rot:sl.rot };
    else {
      /* trails by ~85ms; closes a big gap faster so a flick never leaves it sitting where copy is about to be */
      var far = Math.abs(sl.floor - cur.floor) + Math.abs(sl.cx - cur.cx) + Math.abs(sl.h - cur.h);
      var a = 1 - Math.exp(-dt / (far > 90 ? 45 : 85));
      cur.cx += (sl.cx - cur.cx) * a; cur.floor += (sl.floor - cur.floor) * a; cur.h += (sl.h - cur.h) * a; cur.rot += (sl.rot - cur.rot) * a;
    }
    /* copy always wins: when words are pushing into the can it yields at once (no trailing into them) */
    if (tg.pushDown && cur.floor - cur.h < sl.floor - sl.h - 0.5){ cur.floor = sl.floor; cur.h = sl.h; cur.cx = sl.cx; }
    if (tg.pushUp && cur.floor > sl.floor + 0.5){ cur.floor = sl.floor; cur.h = sl.h; cur.cx = sl.cx; }
    var k2 = cur.h / H0;
    canEl.style.transform = 'translate3d(' + (cur.cx - fw / 2).toFixed(2) + 'px,' + (cur.floor - fh * bf).toFixed(2) + 'px,0) rotate(' + cur.rot.toFixed(2) + 'deg) scale(' + k2.toFixed(4) + ')';
    /* one sweep of the sheen per ~1.1 screens of scroll, across the body of the can (only a transform) */
    var sx = ((s / (1.1 * S)) % 1) * 2.9 - 1.25;
    if (sheenX === null || Math.abs(sx - sheenX) > 0.002){ sheenX = sx; sheenI.style.transform = 'translate3d(' + (sx * 100).toFixed(1) + '%,0,0)'; }
    var moving = Math.abs(sl.cx - cur.cx) + Math.abs(sl.floor - cur.floor) + Math.abs(sl.h - cur.h) + Math.abs(sl.rot - cur.rot) > 0.25;
    if (moving || swapping) schedule(); else lastT = 0;
  }

  /* ================== PICK A CAN (After Dark) — V2's waveSwap, full screen ================== */
  var swapEl = $('swap');
  function pick(id){
    if (swapping || id === drink || !T[id]) return;
    swapping = true;
    var img = new Image(); img.crossOrigin = canImg.getAttribute('crossorigin') === null ? null : 'anonymous'; img.src = canSrc(id);   /* MUNDO · SHIP: the same (CORS-mode) request the can + its mask use */
    var ready = img.decode ? img.decode().catch(function(){}) : Promise.resolve();
    var v = window.MUNDO_VARS(id);
    swapInk = v['--wink0'];
    swapEl.style.color = v['--acc']; swapEl.querySelector('.body').style.background = v['--acc'];
    swapEl.classList.add('on');
    var t0 = performance.now(), UP = 520, HOLD = 90, DOWN = 600, swapped = false, Lh = L, C = 64;
    var anchor = $('rail'), before = anchor.getBoundingClientRect().top;
    function f(now){
      var el = now - t0, y;
      if (el < UP) y = Lh - (Lh + C) * easeWipe(el / UP);
      else if (el < UP + HOLD) y = -C;
      else {
        if (!swapped){
          swapped = true;
          ready.then(function(){
            applyDrink(id);
            /* the copy above may have changed length: keep the rail exactly where the finger left it */
            var after = anchor.getBoundingClientRect().top;
            if (Math.abs(after - before) > 0.5) window.scrollTo(0, window.scrollY + (after - before));
            t0 = performance.now() - UP - HOLD; requestAnimationFrame(f2);
          });
          return;
        }
      }
      swapEl.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)'; swapY = y;
      requestAnimationFrame(f);
    }
    function f2(now){
      var el = now - t0 - UP - HOLD, y = -C + (Lh + C) * easeWipe(Math.min(1, el / DOWN));
      swapEl.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)'; swapY = y;
      if (el < DOWN) requestAnimationFrame(f2);
      else { swapEl.classList.remove('on'); swapping = false; swapY = 1e4; schedule(); }
    }
    requestAnimationFrame(f);
  }
  function applyDrink(id){
    drink = id;
    var v = window.MUNDO_VARS(id);
    for (var k in v) de.style.setProperty(k, v[k]);
    de.setAttribute('data-drink', id);
    setCanImage(id);
    paintCopy(id); markRail(id);
    if (pourWarm) $('inside').querySelectorAll('img').forEach(warmEl);   /* MUNDO · SHIP: the new drink's tokens, decoded ahead too */
    try { history.replaceState(null, '', location.pathname + '?drink=' + id + (/[?&]qa=1/.test(location.search) ? '&qa=1' : '')); } catch(e){}
    layout();
  }

  /* ================== ARRIVAL ================== */
  paintCopy(drink); markRail(drink);
  setCanImage(drink);
  function centerRail(){
    var sel = rail.querySelector('[data-id="' + drink + '"]');
    if (sel) rail.scrollLeft = Math.max(0, sel.offsetLeft - rail.offsetLeft - (rail.clientWidth - sel.offsetWidth) / 2);
  }
  var veil = $('hand-veil'), frog = $('hand-frog'), t0nav = performance.now();
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var canReady = canImg.decode ? canImg.decode().catch(function(){}) : Promise.resolve();
  var timeout = new Promise(function(r){ setTimeout(r, 2600); });
  Promise.race([Promise.all([fontsReady, canReady]), timeout]).then(function(){
    window.scrollTo(0, 0);
    layout();
    frame(performance.now());
    var wait = Math.max(0, 420 - (performance.now() - t0nav));
    if (/[?&]holdveil=1/.test(location.search)) window.__release = release;   /* QA: capture the arrival */
    else setTimeout(release, wait);
  });
  /* a touch never waits on the veil (V1's staged arrival does the same) */
  if (!/[?&]holdveil=1/.test(location.search)) ['pointerdown','touchstart','wheel','keydown'].forEach(function(ev){
    addEventListener(ev, function(){ if (K.ch) release(); }, { once:true, passive:true });
  });
  var released = false;
  function release(){
    if (released) return; released = true;
    frog.classList.add('out');
    veil.classList.add('drain');
    de.style.background = '';
    var t0 = performance.now(), D = quiet ? 1 : 880, Lh = L;
    setTimeout(function(){ de.classList.remove('pre'); de.classList.add('arrived'); }, quiet ? 0 : 260);
    function f(now){
      var el = Math.min(1, (now - t0) / D), y = (Lh + 64) * easeWipe(el);
      veil.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)';
      if (el < 1) requestAnimationFrame(f);
      else { veil.remove(); frog.remove(); arrived = true; idleWarm(); }
    }
    requestAnimationFrame(f);
  }
  /* after arrival, quietly warm what the next screens need (never on the critical path) */
  function idleWarm(){
    var ric = window.requestIdleCallback || function(cb){ return setTimeout(cb, 400); };
    /* MUNDO · SHIP: the rail's thumbnails are loaded AND decoded here, well ahead of the After Dark hinge */
    ric(function(){ rail.querySelectorAll('img').forEach(warmEl); });
  }
  /* width changes (rotation) re-layout; height-only changes (Safari's toolbar) are ignored on purpose:
     nothing here is sized to the dynamic viewport, so nothing can stretch */
  var lastW = innerWidth;
  addEventListener('resize', function(){ if (innerWidth !== lastW){ lastW = innerWidth; layout(); } else schedule(); });
  /* MUNDO · SHIP — page lifecycle (iOS app switch, back/forward cache). Leaving pauses the films; coming
     back re-syncs one frame from the live scroll position (a width that changed while away gets a
     re-layout). A page frozen before its veil drained is released at once — the veil can never stick. */
  function resync(){
    lastT = 0;
    if (K.ch && !released && !/[?&]holdveil=1/.test(location.search)) release();
    if (innerWidth !== lastW){ lastW = innerWidth; if (K.ch) layout(); } else schedule();
  }
  document.addEventListener('visibilitychange', function(){
    pageHidden = document.hidden;
    if (pageHidden) filmsPause(); else resync();
  });
  addEventListener('pagehide', function(){ pageHidden = true; filmsPause(); });
  addEventListener('pageshow', function(e){ pageHidden = document.hidden; if (e.persisted) resync(); });
  /* a web font that lands after the arrival timeout reflows the copy: re-measure once it settles */
  var relayT = 0;
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function(){
    if (!K.ch) return; clearTimeout(relayT); relayT = setTimeout(layout, 120);
  });

  $('foot-again').addEventListener('click', function(){ window.scrollTo({ top: K.ch[1].home, behavior: quiet ? 'auto' : 'smooth' }); });

  /* ---- QA hooks ---- */
  window.__mundo = {
    state: function(){ var r = canEl.getBoundingClientRect(); return { drink:drink, s:scrollY, max:K.max, world:worldNow, can:cur, arrived:arrived,
      ch:K.ch && K.ch.map(function(c){ return { home:Math.round(c.home), park:Math.round(c.park), dwellEnd:Math.round(c.dwellEnd), Ht:c.Ht }; }),
      hinges:K.hinges && K.hinges.map(function(h){ return { s0:Math.round(h.s0), s1:Math.round(h.s1), bare:!!h.bare }; }) }; },
    K: function(){ return K; },
    settle: function(){ cur = null; lastT = 0; frame(performance.now()); },
    pick: pick,
    bodyRect: function(){
      /* the can's BODY (not its transparent frame) in viewport px, from the live transform */
      if (!cur) return null; var h = cur.h, w = h * (T[drink].kind === 'bottle' ? 0.385 : 0.358);
      return { left:cur.cx - w / 2, right:cur.cx + w / 2, top:cur.floor - h, bottom:cur.floor, rot:cur.rot };
    }
  };
})();
</script>
