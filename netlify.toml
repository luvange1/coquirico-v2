# Coquírico V2 — static deploy (this folder is the site root).
# Netlify: set "Publish directory" to this folder and leave the build command empty.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# media is NOT fingerprinted (hero-beach-1080.mp4 was re-encoded under the same name on 2026-09-23),
# so it must revalidate: unchanged files still come from the browser cache via a 304, changed ones
# are picked up. "immutable" here once meant returning visitors kept the old, softer hero for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/v1/coquirico-handoff/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# the pages themselves must always revalidate, or a deploy looks like "nothing changed"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
